[project]
name = "fpga-nn"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Henrik Thoroe", email = "uiqwd@student.kit.edu" }]
dependencies = [
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "numpy>=2.3.5",
    "brevitas>=0.10.2",
    "rich>=14.2.0",
    "click>=8.3.1",
    "onnx>=1.18.0",
    "onnxoptimizer>=0.3.13",
    "dataclasses-json>=0.6.7",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
mnist = { call = "fpga_nn:cli" }
